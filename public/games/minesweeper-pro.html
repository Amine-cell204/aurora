<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minesweeper Pro — HTML Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0c111b; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; gap: 12px; }
    .bar { width: 100%; max-width: 680px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 10px 14px; font-size: 13px; }
    .stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-weight: 700; }
    .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    select, button { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button.active { background: #f59e0b; border-color: #fbbf24; color: #1f1300; }
    button.primary { background: #38bdf8; border-color: #7dd3fc; color: #082f49; }
    .grid { display: grid; gap: 3px; background: rgba(255,255,255,0.06); padding: 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); max-width: 100%; overflow: auto; }
    .cell { width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.14); background: #1e293b; color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .cell:hover:not(.open) { background: #334155; }
    .cell.open { background: #0f172a; border-color: rgba(255,255,255,0.06); cursor: default; }
    .cell.mine { background: #dc2626; }
    .cell.flag { background: #1e293b; color: #fbbf24; }
    .n1 { color: #38bdf8; } .n2 { color: #34d399; } .n3 { color: #fb7185; } .n4 { color: #a78bfa; }
    .n5 { color: #f59e0b; } .n6 { color: #2dd4bf; } .n7 { color: #e2e8f0; } .n8 { color: #94a3b8; }
    .status { font-size: 13px; color: #94a3b8; min-height: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="stats">
        <span>Mines: <span id="minesLeft">10</span></span>
        <span>Time: <span id="timerEl">0</span>s</span>
      </div>
      <div class="controls">
        <select id="diff">
          <option value="9,9,10">Easy (9×9)</option>
          <option value="14,14,32">Medium (14×14)</option>
          <option value="20,14,55">Hard (20×14)</option>
        </select>
        <button id="flagModeBtn">Flag Mode: OFF</button>
        <button id="resetBtn" class="primary">New Board</button>
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="status" class="status">Left click to reveal · Right click (or toggle Flag Mode) to flag mines</div>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const minesLeftEl = document.getElementById('minesLeft');
    const timerEl = document.getElementById('timerEl');
    const diffEl = document.getElementById('diff');
    const flagModeBtn = document.getElementById('flagModeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusEl = document.getElementById('status');

    let cols = 9, rows = 9, totalMines = 10;
    let board = [];
    let firstClick = true;
    let gameOver = false;
    let flagMode = false;
    let sec = 0;
    let interval = null;

    function init() {
      const [c, r, m] = diffEl.value.split(',').map(Number);
      cols = c; rows = r; totalMines = m;
      board = Array.from({ length: rows * cols }, () => ({ mine: false, open: false, flag: false, adj: 0 }));
      firstClick = true;
      gameOver = false;
      sec = 0;
      clearInterval(interval);
      timerEl.textContent = '0';
      minesLeftEl.textContent = String(totalMines);
      statusEl.textContent = 'Left click to reveal · Right click to flag mines';
      gridEl.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
      render();
    }

    function neighbors(idx) {
      const x = idx % cols, y = Math.floor(idx / cols), out = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) out.push(ny * cols + nx);
        }
      }
      return out;
    }

    function placeMines(safeIdx) {
      const forbidden = new Set([safeIdx, ...neighbors(safeIdx)]);
      let placed = 0;
      while (placed < totalMines) {
        const i = Math.floor(Math.random() * board.length);
        if (!forbidden.has(i) && !board[i].mine) {
          board[i].mine = true;
          placed++;
        }
      }
      for (let i = 0; i < board.length; i++) {
        board[i].adj = neighbors(i).filter(n => board[n].mine).length;
      }
      interval = setInterval(() => { sec++; timerEl.textContent = String(sec); }, 1000);
    }

    function reveal(idx) {
      if (gameOver || board[idx].flag || board[idx].open) return;
      if (firstClick) {
        firstClick = false;
        placeMines(idx);
      }
      const stack = [idx];
      while (stack.length) {
        const cur = stack.pop();
        const cell = board[cur];
        if (cell.open || cell.flag) continue;
        cell.open = true;
        if (cell.mine) {
          gameOver = true;
          clearInterval(interval);
          board.forEach(c => { if (c.mine) c.open = true; });
          statusEl.textContent = 'Boom! Hit a mine — click New Board to try again.';
          render();
          return;
        }
        if (cell.adj === 0) {
          neighbors(cur).forEach(n => { if (!board[n].open) stack.push(n); });
        }
      }
      checkWin();
      render();
    }

    function toggleFlag(idx) {
      if (gameOver || board[idx].open) return;
      board[idx].flag = !board[idx].flag;
      const flagged = board.filter(c => c.flag).length;
      minesLeftEl.textContent = String(Math.max(0, totalMines - flagged));
      render();
    }

    function checkWin() {
      const unopenedSafe = board.some(c => !c.mine && !c.open);
      if (!unopenedSafe) {
        gameOver = true;
        clearInterval(interval);
        statusEl.textContent = `Board cleared in ${sec}s!`;
      }
    }

    function render() {
      gridEl.innerHTML = '';
      board.forEach((cell, i) => {
        const el = document.createElement('button');
        el.className = 'cell';
        if (cell.open) {
          el.classList.add('open');
          if (cell.mine) {
            el.classList.add('mine');
            el.textContent = '✸';
          } else if (cell.adj > 0) {
            el.classList.add(`n${cell.adj}`);
            el.textContent = String(cell.adj);
          }
        } else if (cell.flag) {
          el.classList.add('flag');
          el.textContent = '⚑';
        }
        el.addEventListener('click', () => (flagMode ? toggleFlag(i) : reveal(i)));
        el.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(i); });
        gridEl.appendChild(el);
      });
    }

    flagModeBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagModeBtn.textContent = `Flag Mode: ${flagMode ? 'ON' : 'OFF'}`;
      flagModeBtn.classList.toggle('active', flagMode);
    });
    diffEl.addEventListener('change', init);
    resetBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
