<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turbo Pong — HTML Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #080c16; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; user-select: none; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
    .bar { width: 100%; max-width: 720px; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 8px 14px; font-size: 13px; }
    .score { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 6px; }
    button, select { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button.primary { background: #6366f1; border-color: #818cf8; }
    canvas { width: min(94vw, 720px); max-height: 76vh; aspect-ratio: 16 / 10; border-radius: 16px; border: 2px solid rgba(99,102,241,0.4); background: #050811; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .hint { font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="score"><span style="color:#38bdf8" id="p1Score">0</span> : <span style="color:#fb7185" id="p2Score">0</span></div>
      <div style="font-size:12px;color:#cbd5e1">Rally: <b id="rallyEl">0</b></div>
      <div class="controls">
        <select id="players">
          <option value="1">1 Player vs AI</option>
          <option value="2">2 Players Local</option>
        </select>
        <button id="resetBtn" class="primary">Reset</button>
      </div>
    </div>
    <canvas id="c" width="720" height="450"></canvas>
    <div class="hint" id="hint">P1: W / S (or move mouse) · First to 7 points wins</div>
  </div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const p1El = document.getElementById('p1Score');
    const p2El = document.getElementById('p2Score');
    const rallyEl = document.getElementById('rallyEl');
    const playersEl = document.getElementById('players');
    const hintEl = document.getElementById('hint');
    const resetBtn = document.getElementById('resetBtn');

    const keys = {};
    let p1 = { y: 185, h: 86, score: 0 };
    let p2 = { y: 185, h: 86, score: 0 };
    let ball = { x: 360, y: 225, vx: 320, vy: 160, r: 9 };
    let rally = 0;
    let winner = '';

    function serve(dir) {
      ball.x = c.width / 2;
      ball.y = c.height / 2;
      const angle = (Math.random() * 0.7 - 0.35);
      const speed = 350;
      ball.vx = Math.cos(angle) * speed * dir;
      ball.vy = Math.sin(angle) * speed;
      rally = 0;
      rallyEl.textContent = '0';
    }

    function reset() {
      p1 = { y: 185, h: 86, score: 0 };
      p2 = { y: 185, h: 86, score: 0 };
      p1El.textContent = '0';
      p2El.textContent = '0';
      winner = '';
      serve(Math.random() > 0.5 ? 1 : -1);
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.035, (now - last) / 1000);
      last = now;

      if (!winner) {
        const padSpeed = 420;
        if (keys.KeyW || (playersEl.value === '1' && keys.ArrowUp)) p1.y -= padSpeed * dt;
        if (keys.KeyS || (playersEl.value === '1' && keys.ArrowDown)) p1.y += padSpeed * dt;

        if (playersEl.value === '2') {
          if (keys.ArrowUp) p2.y -= padSpeed * dt;
          if (keys.ArrowDown) p2.y += padSpeed * dt;
        } else {
          const target = ball.y - p2.h / 2;
          const diff = target - p2.y;
          p2.y += Math.sign(diff) * Math.min(Math.abs(diff), 330 * dt);
        }

        p1.y = Math.max(8, Math.min(c.height - p1.h - 8, p1.y));
        p2.y = Math.max(8, Math.min(c.height - p2.h - 8, p2.y));

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
        if (ball.y + ball.r > c.height) { ball.y = c.height - ball.r; ball.vy = -Math.abs(ball.vy); }

        // Left paddle
        if (ball.vx < 0 && ball.x - ball.r <= 34 && ball.x - ball.r >= 16 && ball.y >= p1.y - 6 && ball.y <= p1.y + p1.h + 6) {
          const rel = ((ball.y - (p1.y + p1.h / 2)) / (p1.h / 2));
          const speed = Math.min(720, Math.hypot(ball.vx, ball.vy) * 1.06);
          const ang = rel * 1.05;
          ball.vx = Math.cos(ang) * speed;
          ball.vy = Math.sin(ang) * speed;
          ball.x = 34 + ball.r;
          rally++;
          rallyEl.textContent = String(rally);
        }

        // Right paddle
        if (ball.vx > 0 && ball.x + ball.r >= c.width - 34 && ball.x + ball.r <= c.width - 16 && ball.y >= p2.y - 6 && ball.y <= p2.y + p2.h + 6) {
          const rel = ((ball.y - (p2.y + p2.h / 2)) / (p2.h / 2));
          const speed = Math.min(720, Math.hypot(ball.vx, ball.vy) * 1.06);
          const ang = rel * 1.05;
          ball.vx = -Math.cos(ang) * speed;
          ball.vy = Math.sin(ang) * speed;
          ball.x = c.width - 34 - ball.r;
          rally++;
          rallyEl.textContent = String(rally);
        }

        if (ball.x < -15) {
          p2.score++; p2El.textContent = String(p2.score);
          if (p2.score >= 7) winner = playersEl.value === '1' ? 'CPU Wins!' : 'Player 2 Wins!';
          else serve(1);
        } else if (ball.x > c.width + 15) {
          p1.score++; p1El.textContent = String(p1.score);
          if (p1.score >= 7) winner = 'Player 1 Wins!';
          else serve(-1);
        }
      }

      // Render
      ctx.fillStyle = '#050811';
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.setLineDash([8, 10]);
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(c.width / 2, 0); ctx.lineTo(c.width / 2, c.height); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.roundRect(18, p1.y, 14, p1.h, 7); ctx.fill();
      ctx.fillStyle = '#fb7185';
      ctx.beginPath(); ctx.roundRect(c.width - 32, p2.y, 14, p2.h, 7); ctx.fill();

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();

      if (winner) {
        ctx.fillStyle = 'rgba(5,8,17,0.78)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 30px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(winner, c.width / 2, c.height / 2);
      }

      requestAnimationFrame(loop);
    }

    c.addEventListener('pointermove', (e) => {
      if (playersEl.value !== '1') return;
      const r = c.getBoundingClientRect();
      const y = ((e.clientY - r.top) / r.height) * c.height;
      p1.y = Math.max(8, Math.min(c.height - p1.h - 8, y - p1.h / 2));
    });

    playersEl.addEventListener('change', () => {
      hintEl.textContent = playersEl.value === '2'
        ? 'P1: W / S · P2: Up / Down Arrows · First to 7 wins'
        : 'P1: W / S (or move mouse) · First to 7 points wins';
      reset();
    });

    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });
    resetBtn.addEventListener('click', reset);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
